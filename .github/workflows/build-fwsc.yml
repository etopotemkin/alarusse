name: Build FM-1 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # x86-64: JieLi toolchain runs natively, no Docker
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: pip install Pillow fonttools

      - name: Cache JieLi toolchain + AC79 SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1

      - name: Get JieLi toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh

      - name: Get AC79 SDK (3 files used by the packager)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fm1-firmware-${{ github.sha }}
          path: |
            build/*.fwsc
            build/*.bin


  # the host tests, beside the build (they take ~20 min; the package and the installer do not wait for them)
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: pip install Pillow fonttools

      - name: Cache JieLi toolchain + AC79 SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1

      - name: Get JieLi toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh

      - name: Get AC79 SDK (3 files used by the packager)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK

      - name: Build
        run: ./build.sh

      - name: Host tests
        run: sh tests/run_tests.sh

  # the web installer (web/make_site.py) with this build's package, on GitHub Pages (Settings > Pages > Source:
  # GitHub Actions): open it in Chrome or Edge, the FM-1 on USB, Install
  pages:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fm1-firmware-${{ github.sha }}
          path: build
      - name: Make the installer site
        run: |
          python3 web/make_site.py build/felucca.fwsc "rave-${GITHUB_SHA::7}" site
          ls -R site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
